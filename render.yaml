services:
  - type: web
    name: summit-site
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: NOTIFICATION_EMAIL
        sync: false
      - key: VITE_CLOUDINARY_CLOUD_NAME
        sync: false
